<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="16" aria-label="Animated section divider" role="img" viewBox="0 0 1200 16"><defs><linearGradient id="line" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#36BCF7" stop-opacity="0"/><stop offset=".18" stop-color="#36BCF7"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset=".82" stop-color="#22C55E"/><stop offset="1" stop-color="#22C55E" stop-opacity="0"/></linearGradient><linearGradient id="comet" x1="0" x2="1" y1="0" y2="0"><stop class="comet" offset="0" stop-color="#E0F2FE" stop-opacity="0"/><stop class="comet" offset=".6" stop-color="#E0F2FE" stop-opacity=".95"/><stop class="comet" offset="1" stop-color="#E0F2FE" stop-opacity="0"/></linearGradient><filter id="soft" width="140%" height="900%" x="-20%" y="-400%"><feGaussianBlur stdDeviation="2"/></filter><style>@media (prefers-color-scheme:light){.comet{stop-color:#7c3aed}.dot{fill:#1f2937}}</style></defs><rect width="1200" height="6" x="0" y="5" fill="url(#line)" filter="url(#soft)" opacity=".28" rx="3"/><rect width="1200" height="2" x="0" y="7" fill="url(#line)" opacity=".9" rx="1"/><rect width="240" height="4" x="-240" y="6" fill="url(#comet)" filter="url(#soft)" rx="2"><animate attributeName="x" calcMode="spline" dur="4.2s" from="-240" keySplines=".45 0 .55 1" keyTimes="0;1" repeatCount="indefinite" to="1200"/></rect><circle cx="600" cy="8" r="3" fill="#F8FAFC" fill-opacity=".9" class="dot"><animate attributeName="r" dur="2.4s" repeatCount="indefinite" values="2.5;4;2.5"/><animate attributeName="fill-opacity" dur="2.4s" repeatCount="indefinite" values=".9;.5;.9"/></circle><circle cx="600" cy="8" r="3" fill="none" stroke="#8B5CF6" stroke-opacity=".7"><animate attributeName="r" dur="2.4s" repeatCount="indefinite" values="3;9"/><animate attributeName="stroke-opacity" dur="2.4s" repeatCount="indefinite" values=".7;0"/></circle></svg>