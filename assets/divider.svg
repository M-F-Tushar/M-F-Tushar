<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="16" viewBox="0 0 1200 16" role="img" aria-label="Animated section divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36BCF7" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#36BCF7"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="0.82" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#22C55E" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="comet" x1="0" y1="0" x2="1" y2="0">
      <stop class="comet" offset="0" stop-color="#E0F2FE" stop-opacity="0"/>
      <stop class="comet" offset="0.6" stop-color="#E0F2FE" stop-opacity=".95"/>
      <stop class="comet" offset="1" stop-color="#E0F2FE" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-400%" width="140%" height="900%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <style>
      @media (prefers-color-scheme: light) {
        .comet { stop-color: #7C3AED; }
        .dot { fill: #1F2937; }
      }
    </style>
  </defs>
  <rect x="0" y="5" width="1200" height="6" rx="3" fill="url(#line)" opacity=".28" filter="url(#soft)"/>
  <rect x="0" y="7" width="1200" height="2" rx="1" fill="url(#line)" opacity=".9"/>
  <rect x="-240" y="6" width="240" height="4" rx="2" fill="url(#comet)" filter="url(#soft)">
    <animate attributeName="x" from="-240" to="1200" dur="4.2s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1" keyTimes="0;1"/>
  </rect>
  <circle class="dot" cx="600" cy="8" r="3" fill="#F8FAFC" fill-opacity=".9">
    <animate attributeName="r" values="2.5;4;2.5" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values=".9;.5;.9" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="8" r="3" fill="none" stroke="#8B5CF6" stroke-opacity=".7">
    <animate attributeName="r" values="3;9" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values=".7;0" dur="2.4s" repeatCount="indefinite"/>
  </circle>
</svg>
