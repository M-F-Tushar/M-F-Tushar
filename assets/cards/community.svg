<svg xmlns="http://www.w3.org/2000/svg" width="440" height="200" aria-labelledby="t d" role="img" viewBox="0 0 440 200"><title id="t">Open Source — Community and Contribution</title><desc id="d">Learning and building in public, contributing to open-source projects, and collaborating with teams and mentors.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#2A1D0B"/><stop offset="1" stop-color="#0B1220"/></linearGradient><linearGradient id="bar" x1="0" x2="1" y1="0" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#F59E0B" stop-opacity=".12"/><stop offset=".5" stop-color="#F59E0B"/><stop offset="1" stop-color="#F59E0B" stop-opacity=".12"/><animateTransform attributeName="gradientTransform" begin="-.5s" dur="3.4s" from="0 0" repeatCount="indefinite" to="2 0" type="translate"/></linearGradient><filter id="blur" width="220%" height="220%" x="-60%" y="-60%"><feGaussianBlur stdDeviation="30"/></filter><filter id="glow" width="200%" height="200%" x="-50%" y="-50%"><feGaussianBlur result="b" stdDeviation="3"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><clipPath id="frame"><rect width="440" height="200" rx="20"/></clipPath><style>text{font-family:&apos;Segoe UI&apos;,Inter,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif}.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}.d1{animation-delay:.1s}.d2{animation-delay:.3s}.d3{animation-delay:.45s}.d4{animation-delay:.6s}</style></defs><g clip-path="url(#frame)"><rect width="440" height="200" fill="url(#bg)"/><circle cx="410" cy="10" r="90" fill="#F59E0B" fill-opacity=".16" filter="url(#blur)"/><circle cx="30" cy="200" r="70" fill="#F59E0B" fill-opacity=".08" filter="url(#blur)"/></g><rect width="438.5" height="198.5" x=".75" y=".75" fill="none" stroke="#F59E0B" stroke-opacity=".5" stroke-width="1.5" rx="19.5"/><g transform="translate(56 100)"><circle r="44" fill="#F59E0B" fill-opacity=".07"/><circle r="30" fill="none" stroke="#F59E0