<svg xmlns="http://www.w3.org/2000/svg" width="440" height="200" viewBox="0 0 440 200" role="img" aria-labelledby="t d">
  <title id="t">Current Practice — LLM Applications, AI Agents, and Python Tooling</title>
  <desc id="d">Evidence-grounded LLM applications, AI agents that plan and call tools, and Python tooling for data-driven software.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2420"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#22C55E" stop-opacity=".12"/>
      <stop offset="0.5" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#22C55E" stop-opacity=".12"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="2 0" dur="3.4s" begin="-2s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="440" height="200" rx="20"/></clipPath>
    <style>
      text { font-family: 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .rise { animation: rise .8s cubic-bezier(.2,.7,.2,1) both; }
      .d1 { animation-delay: .1s } .d2 { animation-delay: .3s } .d3 { animation-delay: .45s } .d4 { animation-delay: .6s }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .cursor { animation: blink 1.1s steps(2, start) infinite; }
      @keyframes blink { to { opacity: 0; } }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="440" height="200" fill="url(#bg)"/>
    <circle cx="410" cy="10" r="90" fill="#22C55E" fill-opacity=".15" filter="url(#blur)"/>
    <circle cx="30" cy="200" r="70" fill="#22C55E" fill-opacity=".08" filter="url(#blur)"/>
  </g>
  <rect x=".75" y=".75" width="438.5" height="198.5" rx="19.5" fill="none" stroke="#22C55E" stroke-opacity=".5" stroke-width="1.5"/>

  <g transform="translate(56 100)">
    <circle r="44" fill="#22C55E" fill-opacity=".07"/>
    <circle r="30" fill="none" stroke="#22C55E" stroke-opacity=".7">
      <animate attributeName="r" values="30;46" dur="2.8s" begin="-1.8s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values=".6;0" dur="2.8s" begin="-1.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="30" fill="#22C55E" fill-opacity=".14" stroke="#22C55E" stroke-opacity=".65" stroke-width="1.5"/>
    <g filter="url(#glow)">
      <rect x="-18" y="-13" width="36" height="26" rx="5" fill="#052E2B" stroke="#86EFAC" stroke-width="1.8"/>
      <path d="M-11 -5L-4 1L-11 7" fill="none" stroke="#22C55E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect class="cursor" x="0" y="4.5" width="10" height="2.6" rx="1.3" fill="#BBF7D0"/>
    </g>
  </g>

  <g class="rise d1">
    <text x="112" y="58" font-size="21" font-weight="800" fill="#F8FAFC">Current Practice</text>
    <text x="112" y="80" font-size="11.5" font-weight="700" letter-spacing="1.4" fill="#4ADE80">LLM APPS · AGENTS · PYTHON TOOLING</text>
  </g>
  <g font-size="14" fill="#C7D2E3">
    <g class="rise d2"><circle cx="117" cy="110" r="3" fill="#22C55E"/><text x="130" y="114.5">Evidence-grounded LLM applications</text></g>
    <g class="rise d3"><circle cx="117" cy="136" r="3" fill="#22C55E"/><text x="130" y="140.5">AI agents that plan and call tools</text></g>
    <g class="rise d4"><circle cx="117" cy="162" r="3" fill="#22C55E"/><text x="130" y="166.5">Python tooling &amp; data-driven software</text></g>
  </g>
  <rect x="112" y="182" width="304" height="3" rx="1.5" fill="url(#bar)"/>
</svg>
