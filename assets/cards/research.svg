<svg xmlns="http://www.w3.org/2000/svg" width="440" height="200" viewBox="0 0 440 200" role="img" aria-labelledby="t d">
  <title id="t">Research Interests — AI for Scientific Discovery</title>
  <desc id="d">AI applications in agriculture, data-driven molecular and drug discovery, and energy-based systems with decision support.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171633"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#A78BFA" stop-opacity=".12"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity=".12"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="2 0" dur="3.4s" begin="-1s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="440" height="200" rx="20"/></clipPath>
    <style>
      text { font-family: 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .rise { animation: rise .8s cubic-bezier(.2,.7,.2,1) both; }
      .d1 { animation-delay: .1s } .d2 { animation-delay: .3s } .d3 { animation-delay: .45s } .d4 { animation-delay: .6s }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="440" height="200" fill="url(#bg)"/>
    <circle cx="410" cy="10" r="90" fill="#8B5CF6" fill-opacity=".18" filter="url(#blur)"/>
    <circle cx="30" cy="200" r="70" fill="#8B5CF6" fill-opacity=".10" filter="url(#blur)"/>
  </g>
  <rect x=".75" y=".75" width="438.5" height="198.5" rx="19.5" fill="none" stroke="#A78BFA" stroke-opacity=".5" stroke-width="1.5"/>

  <g transform="translate(56 100)">
    <circle r="44" fill="#A78BFA" fill-opacity=".08"/>
    <circle r="30" fill="none" stroke="#A78BFA" stroke-opacity=".7">
      <animate attributeName="r" values="30;46" dur="2.8s" begin="-.9s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values=".6;0" dur="2.8s" begin="-.9s" repeatCount="indefinite"/>
    </circle>
    <circle r="30" fill="#A78BFA" fill-opacity=".14" stroke="#A78BFA" stroke-opacity=".65" stroke-width="1.5"/>
    <g filter="url(#glow)">
      <g>
        <ellipse rx="18" ry="7.5" fill="none" stroke="#C4B5FD" stroke-width="1.6"/>
        <circle r="2.6" fill="#F5F3FF"><animateMotion dur="3s" repeatCount="indefinite" path="M18 0A18 7.5 0 1 1 -18 0A18 7.5 0 1 1 18 0"/></circle>
      </g>
      <g transform="rotate(60)">
        <ellipse rx="18" ry="7.5" fill="none" stroke="#C4B5FD" stroke-width="1.6"/>
        <circle r="2.6" fill="#F5F3FF"><animateMotion dur="4s" begin="-1.3s" repeatCount="indefinite" path="M18 0A18 7.5 0 1 1 -18 0A18 7.5 0 1 1 18 0"/></circle>
      </g>
      <g transform="rotate(120)">
        <ellipse rx="18" ry="7.5" fill="none" stroke="#C4B5FD" stroke-width="1.6"/>
        <circle r="2.6" fill="#F5F3FF"><animateMotion dur="5s" begin="-2.6s" repeatCount="indefinite" path="M18 0A18 7.5 0 1 1 -18 0A18 7.5 0 1 1 18 0"/></circle>
      </g>
      <circle r="4.5" fill="#DDD6FE"/>
    </g>
  </g>

  <g class="rise d1">
    <text x="112" y="58" font-size="21" font-weight="800" fill="#F8FAFC">Research Interests</text>
    <text x="112" y="80" font-size="11.5" font-weight="700" letter-spacing="1.4" fill="#C4B5FD">AI FOR SCIENTIFIC DISCOVERY</text>
  </g>
  <g font-size="14" fill="#C7D2E3">
    <g class="rise d2"><circle cx="117" cy="110" r="3" fill="#A78BFA"/><text x="130" y="114.5">AI applications in agriculture</text></g>
    <g class="rise d3"><circle cx="117" cy="136" r="3" fill="#A78BFA"/><text x="130" y="140.5">Data-driven molecular &amp; drug discovery</text></g>
    <g class="rise d4"><circle cx="117" cy="162" r="3" fill="#A78BFA"/><text x="130" y="166.5">Energy-based systems &amp; decision support</text></g>
  </g>
  <rect x="112" y="182" width="304" height="3" rx="1.5" fill="url(#bar)"/>
</svg>
