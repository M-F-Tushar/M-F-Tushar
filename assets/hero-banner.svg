<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Mahir Faysal Tusher — Machine Learning and AI Engineering</title>
  <desc id="hero-desc">Animated profile banner. Computer Science and Engineering student at CSTU building LLM applications, AI agents, and data-driven software, researching AI for scientific discovery across agriculture, molecular and drug discovery, and energy-based systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06111F"/>
      <stop offset="0.5" stop-color="#0B2447"/>
      <stop offset="1" stop-color="#190E34"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#36BCF7"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#22C55E"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="2 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="accent-static" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36BCF7"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <radialGradient id="core" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#BAE6FD"/>
      <stop offset="0.45" stop-color="#36BCF7"/>
      <stop offset="1" stop-color="#0284C7"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#DCEBFF" fill-opacity="0.16"/>
    </pattern>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="58"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="420" rx="28"/></clipPath>
    <style>
      text { font-family: 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .rise { animation: rise 0.9s cubic-bezier(.2,.7,.2,1) both; }
      .d1 { animation-delay: .1s } .d2 { animation-delay: .3s } .d3 { animation-delay: .5s }
      .d4 { animation-delay: .7s } .d5 { animation-delay: .9s } .d6 { animation-delay: 1.1s } .d7 { animation-delay: 1.3s }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      .float { animation: float 10s ease-in-out infinite; }
      .float-slow { animation: float 14s ease-in-out -5s infinite; }
      @keyframes float { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(0, -18px); } }
      .drift { animation: drift 6.5s ease-in-out infinite; }
      @keyframes drift { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(0, -7px); } }
      .blink { animation: blink 1.8s ease-in-out infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
      .constellation { animation: reveal 1.4s ease-out .4s both; }
      @keyframes reveal { from { opacity: 0; } to { opacity: 1; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <rect width="1200" height="420" fill="url(#dots)"/>
    <g class="float"><circle cx="1010" cy="60" r="210" fill="#8B5CF6" fill-opacity="0.17" filter="url(#blur)"/></g>
    <g class="float-slow"><circle cx="150" cy="440" r="230" fill="#36BCF7" fill-opacity="0.13" filter="url(#blur)"/></g>
    <g class="float-slow"><circle cx="690" cy="430" r="170" fill="#22C55E" fill-opacity="0.09" filter="url(#blur)"/></g>
    <path d="M0 302C150 252 280 264 420 302C580 344 760 338 920 282C1040 240 1120 242 1200 264" stroke="url(#accent-static)" stroke-opacity="0.32" stroke-width="1.5" fill="none"/>
    <rect x="0" y="414" width="1200" height="6" fill="url(#accent)"/>
  </g>

  <!-- Status pill -->
  <g class="rise d1">
    <rect x="64" y="50" width="332" height="30" rx="15" fill="#22C55E" fill-opacity="0.10" stroke="#22C55E" stroke-opacity="0.55"/>
    <circle cx="82" cy="65" r="5" fill="#22C55E" class="blink"/>
    <circle cx="82" cy="65" r="5" fill="none" stroke="#22C55E" stroke-opacity=".8">
      <animate attributeName="r" values="5;12" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values=".8;0" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="96" y="70" font-size="13" font-weight="600" fill="#BBF7D0">Open to ML / AI Engineering internships</text>
  </g>

  <!-- Identity -->
  <g class="rise d2">
    <text x="64" y="118" font-size="13" font-weight="700" letter-spacing="3" fill="#36BCF7">CSE STUDENT · CSTU · BANGLADESH</text>
  </g>
  <g class="rise d3">
    <text x="62" y="176" font-size="54" font-weight="800" letter-spacing="-0.5" fill="#F8FAFC">Mahir Faysal Tusher</text>
  </g>
  <g class="rise d4">
    <text x="64" y="218" font-size="26" font-weight="700" fill="url(#accent)">Machine Learning &amp; AI Engineering</text>
  </g>
  <g class="rise d5">
    <text x="64" y="254" font-size="16" fill="#B6C2D6">Building LLM applications, AI agents, and data-driven software.</text>
    <text x="64" y="278" font-size="16" fill="#B6C2D6">Researching AI for scientific discovery — agriculture, molecules, energy.</text>
  </g>

  <!-- Chips -->
  <g class="rise d6" font-size="13" font-weight="600" text-anchor="middle">
    <rect x="64" y="300" width="150" height="30" rx="15" fill="#36BCF7" fill-opacity="0.10" stroke="#36BCF7" stroke-opacity="0.55"/>
    <text x="139" y="320" fill="#BAE6FD">LLM Applications</text>
    <rect x="224" y="300" width="104" height="30" rx="15" fill="#A78BFA" fill-opacity="0.12" stroke="#A78BFA" stroke-opacity="0.6"/>
    <text x="276" y="320" fill="#DDD6FE">AI Agents</text>
    <rect x="338" y="300" width="138" height="30" rx="15" fill="#22C55E" fill-opacity="0.10" stroke="#22C55E" stroke-opacity="0.55"/>
    <text x="407" y="320" fill="#BBF7D0">Python Tooling</text>
    <rect x="486" y="300" width="186" height="30" rx="15" fill="#F59E0B" fill-opacity="0.12" stroke="#F59E0B" stroke-opacity="0.6"/>
    <text x="579" y="320" fill="#FDE68A">Data-Driven Software</text>
  </g>
  <g class="rise d7" font-size="13" font-weight="600" text-anchor="middle">
    <rect x="64" y="340" width="226" height="30" rx="15" fill="#F472B6" fill-opacity="0.10" stroke="#F472B6" stroke-opacity="0.55"/>
    <text x="177" y="360" fill="#FBCFE8">AI for Scientific Discovery</text>
    <rect x="300" y="340" width="192" height="30" rx="15" fill="#DCEBFF" fill-opacity="0.07" stroke="#DCEBFF" stroke-opacity="0.35"/>
    <text x="396" y="360" fill="#E2E8F0">Open Source Community</text>
  </g>

  <!-- Neural constellation -->
  <g class="constellation" transform="translate(736 28)">
    <path d="M212 186L72 92M212 186L372 108M212 186L306 302M212 186L150 278M212 186L100 186M212 186L338 212M212 186L206 66M72 92L100 186M72 92L28 176M72 92L206 66M372 108L410 36M372 108L338 212M372 108L404 252M372 108L300 26M306 302L404 252M306 302L238 342M306 302L150 278M150 278L52 306M100 186L52 306M100 186L28 176M206 66L300 26M338 212L404 252" stroke="#7DD3FC" stroke-opacity="0.22" stroke-width="1.2" fill="none"/>

    <g stroke="#36BCF7" stroke-opacity="0.75" stroke-width="1.6" stroke-dasharray="6 14" fill="none">
      <path d="M212 186L72 92"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.4s" repeatCount="indefinite"/></path>
      <path d="M212 186L372 108"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.7s" repeatCount="indefinite"/></path>
      <path d="M212 186L306 302"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.55s" repeatCount="indefinite"/></path>
    </g>

    <g fill="#DCEBFF">
      <circle cx="150" cy="278" r="5" fill-opacity=".85"/>
      <circle cx="100" cy="186" r="4" fill-opacity=".75"/>
      <circle cx="338" cy="212" r="5" fill-opacity=".85"/>
      <circle cx="206" cy="66" r="4.5" fill-opacity=".8"/>
      <circle cx="404" cy="252" r="4" fill-opacity=".7"/>
      <circle cx="52" cy="306" r="3.5" fill-opacity=".6"/>
      <circle cx="410" cy="36" r="3.5" fill-opacity=".6"/>
      <circle cx="238" cy="342" r="4" fill-opacity=".7"/>
      <circle cx="28" cy="176" r="3" fill-opacity=".55"/>
      <circle cx="300" cy="26" r="3" fill-opacity=".55"/>
    </g>

    <!-- Signal pulses -->
    <circle r="4" fill="#E0F2FE" filter="url(#glow)">
      <animateMotion dur="2.6s" repeatCount="indefinite" path="M212 186L72 92"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.85;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#E9D5FF" filter="url(#glow)">
      <animateMotion dur="3s" begin="-1s" repeatCount="indefinite" path="M212 186L372 108"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.85;1" dur="3s" begin="-1s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#FDE68A" filter="url(#glow)">
      <animateMotion dur="2.8s" begin="-1.9s" repeatCount="indefinite" path="M212 186L306 302"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.85;1" dur="2.8s" begin="-1.9s" repeatCount="indefinite"/>
    </circle>

    <!-- Core -->
    <g transform="translate(212 186)">
      <circle r="74" fill="none" stroke="#36BCF7" stroke-opacity=".3" stroke-width="1" stroke-dasharray="3 9">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="46s" repeatCount="indefinite"/>
      </circle>
      <circle r="57" fill="none" stroke="#A78BFA" stroke-opacity=".38" stroke-width="1.2" stroke-dasharray="16 10">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="32s" repeatCount="indefinite"/>
      </circle>
      <circle r="36" fill="#36BCF7" fill-opacity=".35" stroke="#36BCF7" stroke-opacity=".6">
        <animate attributeName="r" values="36;72" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="fill-opacity" values=".3;0" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values=".6;0" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle r="36" fill="url(#core)" filter="url(#glow)"/>
      <text y="10" text-anchor="middle" font-size="26" font-weight="800" fill="#06111F">AI</text>
    </g>

    <!-- Agriculture -->
    <g class="drift">
      <g transform="translate(72 92)">
        <circle r="38" fill="#22C55E" fill-opacity=".10"/>
        <circle r="27" fill="#0B1F33" stroke="#22C55E" stroke-width="2.5" filter="url(#glow)"/>
        <g transform="scale(1.1)">
          <path d="M-10 10C-10 -2 -1 -11 11 -11C11 1 2 10 -10 10Z" fill="#22C55E"/>
          <path d="M-10 10L6 -6" stroke="#052E2B" stroke-width="1.6" stroke-linecap="round"/>
        </g>
        <text y="50" text-anchor="middle" font-size="12.5" font-weight="700" fill="#DCEBFF">Agriculture</text>
      </g>
    </g>

    <!-- Molecular and drug discovery -->
    <g class="drift" style="animation-delay:-2.2s">
      <g transform="translate(372 108)">
        <circle r="38" fill="#A78BFA" fill-opacity=".12"/>
        <circle r="27" fill="#0B1F33" stroke="#A78BFA" stroke-width="2.5" filter="url(#glow)"/>
        <g transform="translate(-2 1) scale(1.15)">
          <polygon points="0,-10 8.66,-5 8.66,5 0,10 -8.66,5 -8.66,-5" fill="none" stroke="#C4B5FD" stroke-width="1.9" stroke-linejoin="round"/>
          <circle r="5.2" fill="none" stroke="#C4B5FD" stroke-width="1.4" stroke-opacity=".85"/>
          <path d="M8.66 -5L14.5 -8.4" stroke="#C4B5FD" stroke-width="1.9" stroke-linecap="round"/>
          <circle cx="15" cy="-8.7" r="2.9" fill="#DDD6FE"/>
          <circle cx="0" cy="10" r="2.4" fill="#A78BFA"/>
        </g>
        <text y="50" text-anchor="middle" font-size="12.5" font-weight="700" fill="#DCEBFF">Molecular &amp; Drug</text>
        <text y="66" text-anchor="middle" font-size="12.5" font-weight="700" fill="#DCEBFF">Discovery</text>
      </g>
    </g>

    <!-- Energy-based systems -->
    <g class="drift" style="animation-delay:-4.1s">
      <g transform="translate(306 302)">
        <circle r="38" fill="#F59E0B" fill-opacity=".12"/>
        <circle r="27" fill="#0B1F33" stroke="#F59E0B" stroke-width="2.5" filter="url(#glow)"/>
        <path d="M3 -13L-8 2L-1 2L-3 13L8 -2L1 -2Z" fill="#FBBF24"/>
        <text y="50" text-anchor="middle" font-size="12.5" font-weight="700" fill="#DCEBFF">Energy Systems</text>
      </g>
    </g>
  </g>

  <rect x=".75" y=".75" width="1198.5" height="418.5" rx="27.5" fill="none" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="1.5"/>
</svg>
