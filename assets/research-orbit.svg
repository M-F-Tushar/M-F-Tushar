low)"/><text y="-2" fill="#06111F" font-size="32" font-weight="800" text-anchor="middle">AI</text><text y="22" fill="#082F49" font-size="13" font-weight="700" letter-spacing=".6" text-anchor="middle">for Science</text></g><g font-size="12" font-weight="700" text-anchor="middle"><g><animateMotion dur="22s" path="M685 232A185 66 0 1 0 315 232A185 66 0 1 0 685 232" repeatCount="indefinite"/><rect width="76" height="26" x="-38" y="-13" fill="#0D1117" stroke="#36BCF7" stroke-opacity=".8" stroke-width="1.4" rx="13"/><text y="4.5" fill="#BAE6FD">Data</text></g><g><animateMotion begin="-7.33s" dur="22s" path="M685 232A185 66 0 1 0 315 232A185 66 0 1 0 685 232" repeatCount="indefinite"/><rect width="84" height="26" x="-42" y="-13" fill="#0D1117" stroke="#36BCF7" stroke-opacity=".8" stroke-width="1.4" rx="13"/><text y="4.5" fill="#BAE6FD">Models</text></g><g><animateMotion begin="-14.66s" dur="22s" path="M685 232A185 66 0 1 0 315 232A185 66 0 1 0 685 232" repeatCount="indefinite"/><rect width="100" height="26" x="-50" y="-13" fill="#0D1117" stroke="#36BCF7" stroke-opacity=".8" stroke-width="1.4" rx="13"/><text y="4.5" fill="#BAE6FD">Evaluation</text></g></g><g><animateMotion dur="36s" path="M860 232A360 148 0 1 1 140 232A360 148 0 1 1 860 232" repeatCount="indefinite"/><circle r="44" fill="#22C55E" fill-opacity=".1"/><circle r="32" fill="#0B1F33" stroke="#22C55E" stroke-width="2.5" filter="url(#glow)"/><g><path fill="#22C55E" d="M-10 10C-10 -2 -1 -11 11 -11C11 1 2 10 -10 10Z" transform="scale(1.35)"/><path stroke="#052E2B" stroke-linecap="round" stroke-width="1.6" d="M-10 10L6 -6" transform="scale(1.35)"/></g><text y="56" fill="#DCEBFF" font-size="13.5" font-weight="700" text-anchor="middle">Agriculture</text></g><g><animateMotion begin="-12s" dur="36s" path="M860 232A360 148 0 1 1 140 232A360 148 0 1 1 860 232" repeatCount="indefinite"/><circle r="44" fill="#A78BFA" fill-opacity=".12"/><circle r="32" fill="#0B1F33" stroke="#A78BFA" stroke-width="2.5" filter="url(#glow)"/><g 