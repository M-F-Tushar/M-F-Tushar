<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" aria-labelledby="t d" role="img" viewBox="0 0 1000 460"><title id="t">Research interests — AI for scientific discovery</title><desc id="d">Animated orbit diagram. A central AI-for-science hub with three orbiting research domains: agriculture, molecular and drug discovery, and energy-based systems, supported by data, models, and evaluation.</desc><defs><linearGradient id="bg" x1="0" x2="1000" y1="0" y2="460" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#06111F"/><stop offset=".55" stop-color="#0B2447"/><stop offset="1" stop-color="#190E34"/></linearGradient><radialGradient id="hub" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#BAE6FD"/><stop offset=".45" stop-color="#36BCF7"/><stop offset="1" stop-color="#0369A1"/></radialGradient><pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#DCEBFF" fill-opacity=".14"/></pattern><filter id="blur" width="220%" height="220%" x="-60%" y="-60%"><feGaussianBlur stdDeviation="55"/></filter><filter id="glow" width="200%" height="200%" x="-50%" y="-50%"><feGaussianBlur result="b" stdDeviation="5"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><clipPath id="frame"><rect width="1000" height="460" rx="28"/></clipPath><style>@keyframes float{0%{transform:translate(0,0)}50%{transform:translate(0,-16px)}}text{font-family:&apos;Segoe UI&apos;,Inter,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif}.float{animation:float 12s ease-in-out infinite}.float-slow{animation:float 16s ease-in-out -6s infinite}.fade{animation:fade 1.2s ease-out .2s both}</style></defs><g clip-path="url(#frame)"><rect width="1000" height="460" fill="url(#bg)"/><rect width="1000" height="460" fill="url(#dots)"/><g class="float"><circle cx="840" cy="60" r="200" fill="#8B5CF6" fill-opacity=".18" filter="url(#blur)"/></g><g class="float-slow"><circle cx="140" cy="440" r="210" fill="#22C5