<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" aria-labelledby="t d" role="img" viewBox="0 0 1200 180"><title id="t">Thanks for stopping by</title><desc id="d">Animated footer with flowing waves and a closing message: let&apos;s build AI that matters — for science, for people, in the open.</desc><defs><linearGradient id="bg" x1="0" x2="1200" y1="0" y2="180" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#190E34"/><stop offset=".5" stop-color="#0B2447"/><stop offset="1" stop-color="#06111F"/></linearGradient><linearGradient id="w1" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#36BCF7"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient><linearGradient id="w2" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22C55E"/></linearGradient><linearGradient id="w3" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#22C55E"/><stop offset="1" stop-color="#36BCF7"/></linearGradient><linearGradient id="accent" x1="0" x2="1" y1="0" y2="0" spreadMethod="reflect"><stop offset="0" stop-color="#36BCF7"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#22C55E"/><animateTransform attributeName="gradientTransform" dur="7s" from="0 0" repeatCount="indefinite" to="2 0" type="translate"/></linearGradient><pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#DCEBFF" fill-opacity=".14"/></pattern><clipPath id="frame"><rect width="1200" height="180" rx="28"/></clipPath><style>text{font-family:&apos;Segoe UI&apos;,Inter,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif}.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}.d1{animation-delay:.15s}.d2{animation-delay:.4s}</style></defs><g clip-path="url(#frame)"><rect width="1200" height="180" fill="url(#bg)"/><rect width="1200" height="180" fill="url(#dots)"/><path fill="url(#w1)" fill-opacity=".22" d="M0 122C300 72 300 172 600 122C900 72 900 172 1200 122C1500 72 1500 172 1800 122C2100 72 2100 172 2400 122L2400 180L0 180Z"><animateTransform attributeName="transform" dur="16s" from="0 0" repeatCount="indefinite" to="-1200 0" type="translate"/></path><path fill="url(#w2)" fill-opacity=".3" d="M0 136C300 96 300 176 600 136C900 96 900 176 1200 136C1500 96 1500 176 1800 136C2100 96 2100 176 2400 136L2400 180L0 180Z"><animateTransform attributeName="transform" dur="12s" from="-1200 0" repeatCount="indefinite" to="0 0" type="translate"/></path><path fill="url(#w3)" fill-opacity=".45" d="M0 150C300 120 300 180 600 150C900 120 900 180 1200 150C1500 120 1500 180 1800 150C2100 120 2100 180 2400 150L2400 180L0 180Z"><animateTransform attributeName="transform" dur="9s" from="0 0" repeatCount="indefinite" to="-1200 0" type="translate"/></path></g><g class="rise d1"><text x="600" y="66" fill="#F8FAFC" font-size="26" font-weight="800" text-anchor="middle">Thanks for stopping by</text></g><g class="rise d2"><text x="600" y="98" fill="#C7D2E3" font-size="15" font-weight="500" text-anchor="middle">Let&apos;s build AI that matters — for science, for people, in the open.</text></g><rect width="120" height="3" x="540" y="112" fill="url(#accent)" rx="1.5"/><rect width="1198.5" height="178.5" x=".75" y=".75" fill="none" stroke="#FFF" stroke-opacity=".08" stroke-width="1.5" rx="27.5"/></svg>